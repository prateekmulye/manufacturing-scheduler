global
    maxconn 4
    nbthread 1
    # One whole 1 MiB request plus bounded headers; at most four connections.
    tune.bufsize 1114112
    tune.maxrewrite 1024
    tune.http.maxhdr 64

defaults
    mode http
    timeout connect 2s
    timeout client 45s
    timeout server 45s
    timeout queue 1s
    timeout http-request 5s
    timeout http-keep-alive 2s
    option http-buffer-request
    option http-server-close
    retries 0

frontend public
    bind :8080
    # Bodies must fit completely before the app is contacted. Chunked uploads
    # are not supported by either public JSON API.
    http-request deny deny_status 400 if { req.hdr(transfer-encoding) -m found }
    http-request deny deny_status 431 if { req.hdrs,length gt 16384 }
    http-request deny deny_status 414 if { url,length gt 2048 }
    http-request deny deny_status 413 if { req.body_size gt 1048576 }
    http-request deny deny_status 413 if { req.body_len gt 1048576 }
    http-request del-header Forwarded
    http-request del-header X-Forwarded-For
    http-request del-header X-Forwarded-Host
    http-request del-header X-Forwarded-Proto
    http-request del-header X-Forwarded-Port
    default_backend application

backend application
    server app 127.0.0.1:8081 maxconn 4
